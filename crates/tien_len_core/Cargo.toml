[package]
name = "tien_len_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Tien Len Mien Nam core game engine in Rust/Wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"
