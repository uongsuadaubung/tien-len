<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Nền Bo Tròn (Squircle App Icon) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Lá Bài Phụ Bên Trái (3 Bích) -->
  <g transform="translate(140, 240) rotate(-18) translate(-90, -130)" filter="url(#shadow)">
    <rect width="180" height="260" rx="16" fill="url(#cardGrad)" stroke="#d4d4d8" stroke-width="2" />
    <text x="22" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#18181b">3</text>
    <text x="22" y="80" font-size="28" fill="#18181b">♠</text>
    <!-- Biểu tượng chính giữa -->
    <text x="90" y="160" font-size="70" text-anchor="middle" fill="#18181b">♠</text>
  </g>

  <!-- Lá Bài Chính Phía Trước (Heo Cơ - 2 Cơ) -->
  <g transform="translate(290, 260) rotate(10) translate(-90, -130)" filter="url(#shadow)">
    <rect width="180" height="260" rx="16" fill="url(#cardGrad)" stroke="#e4e4e7" stroke-width="2" />
    <text x="22" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#dc2626">2</text>
    <text x="22" y="80" font-size="28" fill="#dc2626">♥</text>
    <!-- Biểu tượng Heo Cơ rực rỡ -->
    <text x="90" y="160" font-size="70" text-anchor="middle" fill="#dc2626">♥</text>
  </g>

  <!-- Vương Miện Vàng Đỉnh Cao -->
  <g transform="translate(256, 105) scale(1.1)">
    <path d="M-45,25 L-55,-25 L-20,-5 L0,-38 L20,-5 L55,-25 L45,25 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
    <!-- Kim Cương Đính Vương Miện -->
    <circle cx="-55" cy="-25" r="5" fill="#ffffff" />
    <circle cx="0" cy="-38" r="6" fill="#ffffff" />
    <circle cx="55" cy="-25" r="5" fill="#ffffff" />
  </g>

  <!-- Nhãn Tiến Lên Viền Vàng -->
  <g transform="translate(256, 440)">
    <rect x="-140" y="-30" width="280" height="50" rx="25" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">TIẾN LÊN</text>
  </g>
</svg>
